name: Build Jarvis AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract project zip if needed
        run: |
          if [ ! -d "android" ]; then
            echo "No 'android' folder found at repo root, looking for a zip file to extract..."
            zipfile=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
            if [ -n "$zipfile" ]; then
              echo "Found zip: $zipfile - extracting..."
              unzip -o "$zipfile" -d .
            else
              echo "No zip file found either. Failing build."
              exit 1
            fi
          fi
          echo "Repo root contents:"
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --warning-mode all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
